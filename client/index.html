<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('navora_theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            var metaColor = document.querySelector('meta[name="theme-color"]');
            var metaScheme = document.querySelector('meta[name="color-scheme"]');
            if (metaColor) metaColor.setAttribute('content', '#F8FAFC');
            if (metaScheme) metaScheme.setAttribute('content', 'light');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="✦ NAVORA AI – AI-Powered Personalized Outing Planner for Tumkur (Tumakuru) District, Karnataka. Plan less, Experience more." />

    <!-- PWA Web App Manifest for Android & Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple iOS Safari & Home Screen Web App Configuration -->

    <!-- Register PWA Service Worker for Offline & Mobile Caching -->

      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {

          });
        });
